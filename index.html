<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Académico - Plataforma Demonstrativa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f2d1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background-color: #1a432e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 {
            text-align: center;
            color: #4cd964;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #2d6a4f;
            background-color: #0d2818;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2ec4b6;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #20a495;
        }
        .demo-notice {
            margin-top: 15px;
            font-size: 12px;
            color: #ffb703;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Criar Conta (Simulação)</h2>
    <form id="registerForm" onsubmit="validarRegisto(event)">
        <div class="form-group">
            <label for="phone">Número de Telefone:</label>
            <input type="tel" id="phone" placeholder="(00) 90000-0000" required>
        </div>
        <div class="form-group">
            <label for="password">Palavra-passe (mínimo 8 caracteres):</label>
            <input type="password" id="password" minlength="8" required>
        </div>
        <button type="submit">Registar</button>
    </form>
    <p class="demo-notice">Ambiente de Demonstração Académica — Nenhuma transação real é efetuada.</p>
</div>

<script>
function validarRegisto(event) {
    event.preventDefault();
    const phone = document.getElementById('phone').value;
    const password = document.getElementById('password').value;

    if (password.length < 8) {
        alert('A palavra-passe deve ter pelo menos 8 caracteres.');
        return;
    }

    alert('Registo simulado com sucesso!\nTelefone: ' + phone);
}
</script>

</body>
</html>
