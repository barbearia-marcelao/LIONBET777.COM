<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030208;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
        }

        #spaceCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .content-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Texto "Te amo" no centro do coração */
        .title-text {
            position: absolute;
            top: 31%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8rem;
            font-weight: 700;
            font-style: italic;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 20px rgba(255, 255, 255, 0.6);
            font-family: 'Times New Roman', serif;
            letter-spacing: 1px;
            pointer-events: auto;
        }

        /* Fotos Pequenas idênticas ao vídeo */
        .small-photo {
            position: absolute;
            width: 38px;
            height: 38px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
        }

        .small-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .small-photo:hover {
            transform: scale(1.4);
            z-index: 10;
        }

        /* Textos e Tags Flutuantes */
        .love-tag {
            position: absolute;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
            pointer-events: auto;
            user-select: none;
            white-space: nowrap;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <canvas id="spaceCanvas"></canvas>

    <div class="content-layer">
        <div class="title-text">Te amo</div>

        <!-- 5 Fotos pequenas com os nomes exatos -->
        <div class="small-photo" style="top: 22%; left: 47%;">
            <img src="IMG_4709_324884.jpg" alt="Foto 1">
        </div>
        <div class="small-photo" style="top: 35%; right: 22%;">
            <img src="IMG_4708_324884.jpg" alt="Foto 2">
        </div>
        <div class="small-photo" style="top: 42%; left: 28%;">
            <img src="IMG_4710_324884.jpg" alt="Foto 3">
        </div>
        <div class="small-photo" style="top: 41%; right: 38%;">
            <img src="IMG_4706_324884.jpg" alt="Foto 4">
        </div>
        <div class="small-photo" style="top: 50%; left: 45%;">
            <img src="IMG_4707_324884.jpg" alt="Foto 5">
        </div>

        <!-- Frases do print -->
        <div class="love-tag" style="top: 39%; left: 39%;">Mi Amor</div>
        <div class="love-tag" style="top: 40%; right: 30%;">Te Amo</div>
        <div class="love-tag" style="top: 46%; left: 19%;">Me encantas</div>
        <div class="love-tag" style="top: 48%; right: 17%;">Siempre juntos</div>
        <div class="love-tag" style="top: 57%; left: 2%; font-size: 0.85rem;">Amor de mi vida</div>
        <div class="love-tag" style="top: 33%; left: 7%;">Eres preciosa</div>
        <div class="love-tag" style="top: 24%; right: 9%;">Eres mi sol</div>
        <div class="love-tag" style="bottom: 22%; left: 46%;">Eu te amo ❤️</div>
    </div>

    <script>
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. Estrelas de fundo
        const stars = [];
        for (let i = 0; i < 400; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.4,
                alpha: Math.random()
            });
        }

        // 2. Galáxia Espiral Central
        let galaxyRotation = 0;

        // 3. Coração de Poeira
        const heartParticles = [];
        const numHeartParticles = 1400;

        for (let i = 0; i < numHeartParticles; i++) {
            const t = Math.PI * 2 * (i / numHeartParticles);
            let hx = 16 * Math.pow(Math.sin(t), 3);
            let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            
            hx += (Math.random() - 0.5) * 2.5;
            hy += (Math.random() - 0.5) * 2.5;

            const scale = Math.min(width, height) * 0.0085;

            heartParticles.push({
                baseX: hx * scale,
                baseY: hy * scale - (height * 0.18),
                size: Math.random() * 1.5 + 0.3,
                alpha: Math.random() * 0.8 + 0.2
            });
        }

        function drawSpiralGalaxy(cx, cy, rotation) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rotation);
            ctx.scale(1.8, 0.6); // Achatamento para efeito 3D de perspectiva

            const arms = 2;
            const particlesPerArm = 1000;

            for (let a = 0; a < arms; a++) {
                const armOffset = a * Math.PI;
                for (let i = 0; i < particlesPerArm; i++) {
                    const dist = Math.pow(i / particlesPerArm, 1.5) * (Math.min(width, height) * 0.16);
                    const angle = armOffset + dist * 0.04;
                    
                    const spreadX = (Math.random() - 0.5) * (dist * 0.35 + 4);
                    const spreadY = (Math.random() - 0.5) * (dist * 0.35 + 4);

                    const x = Math.cos(angle) * dist + spreadX;
                    const y = Math.sin(angle) * dist + spreadY;

                    const alpha = (1 - (dist / (Math.min(width, height) * 0.16))) * 0.8;
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.05, alpha)})`;
                    ctx.beginPath();
                    ctx.arc(x, y, Math.random() * 1.3 + 0.3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Brilho do Núcleo
            const coreGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, 35);
            coreGlow.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            coreGlow.addColorStop(0.4, 'rgba(230, 240, 255, 0.6)');
            coreGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = coreGlow;
            ctx.beginPath();
            ctx.arc(0, 0, 35, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function animate() {
            ctx.fillStyle = '#030208';
            ctx.fillRect(0, 0, width, height);

            // Desenhar estrelas
            ctx.fillStyle = '#ffffff';
            for (let star of stars) {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // Desenhar Galáxia Espiral
            galaxyRotation += 0.003;
            drawSpiralGalaxy(centerX, centerY + (height * 0.08), galaxyRotation);

            // Desenhar Coração
            for (let hp of heartParticles) {
                ctx.fillStyle = '#ffffff';
                ctx.globalAlpha = hp.alpha;
                ctx.beginPath();
                ctx.arc(centerX + hp.baseX, centerY + hp.baseY, hp.size, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.globalAlpha = 1;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
